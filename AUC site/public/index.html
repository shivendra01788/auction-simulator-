<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPL Mega Auction Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 2.2rem; }
    
    /* Layout Grid */
    .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
    
    /* Lobby Screen */
    .lobby-form { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    input, button { padding: 12px; border-radius: 8px; border: none; outline: none; font-size: 1rem; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; flex: 1; min-width: 150px; }
    button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #0369a1; }
    
    /* Auction Arena */
    .player-card { text-align: center; }
    .player-name { font-size: 1.8rem; font-weight: bold; color: #facc15; }
    .player-badge { display: inline-block; background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; margin: 5px 0; }
    .bid-box { font-size: 2.2rem; color: #4ade80; margin: 15px 0; font-weight: bold; }
    .timer { font-size: 1.5rem; color: #ef4444; font-weight: bold; }

    /* Controls */
    .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .btn-bid { background: #16a34a; flex: 2; font-size: 1.2rem; padding: 15px; }
    .btn-bid:hover { background: #15803d; }
    .btn-sim { background: #d97706; flex: 1; }
    
    /* Teams Grid */
    .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .team-btn { background: #334155; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .team-btn.claimed { border-color: #ef4444; cursor: not-allowed; opacity: 0.6; }
    .team-btn.my-team { border-color: #38bdf8; background: #0c4a6e; opacity: 1; }

    /* Feed & Logs */
    .feed-box { height: 180px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; }
    .feed-item { margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .hidden { display: none; }
  </style>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>IPL Mega Auction Simulator</h1>
      <p id="room-display">Join or create a room to start bidding</p>
    </header>

    <!-- SECTION 1: LOBBY -->
    <div id="lobby-section" class="card">
      <h2>Auction Lobby</h2>
      <div class="lobby-form">
        <input type="text" id="username-input" placeholder="Your Name (e.g., Alex)" />
        <button onclick="createRoom()">Create New Room</button>
      </div>
      <div class="lobby-form" style="margin-top: 10px;">
        <input type="text" id="room-code-input" placeholder="Enter 4-Digit Room Code" />
        <button onclick="joinRoom()">Join Room</button>
      </div>
    </div>

    <!-- SECTION 2: AUCTION DASHBOARD -->
    <div id="auction-section" class="grid-layout hidden">
      <div>
        <!-- Current Bidding Arena -->
        <div class="card player-card">
          <div class="player-badge" id="player-role">Role: Batter</div>
          <div class="player-name" id="player-name">Player Name</div>
          <div>Base Price: <span id="player-base">₹200L</span> | Rating: <span id="player-rating">90</span></div>

          <div class="bid-box">
            Current Bid: <span id="current-bid">₹200L</span>
            <div style="font-size: 1rem; color: #94a3b8;" id="highest-bidder">Highest Bidder: No Bids</div>
          </div>

          <div class="timer">Time Remaining: <span id="timer-val">8</span>s</div>

          <!-- Bidding Action Controls (Retention UI completely removed) -->
          <div class="controls">
            <button class="btn-bid" onclick="placeBid()">PLACE BID 💰</button>
            <button class="btn-sim" id="admin-auto-btn" onclick="triggerAutoBid()">Auto-Bid (Sim)</button>
          </div>
        </div>

        <!-- Activity Feed -->
        <div class="card">
          <h3>Live Auction Log</h3>
          <div class="feed-box" id="activity-log"></div>
        </div>
      </div>

      <!-- Right Column: Franchise Selection & Status -->
      <div>
        <div class="card">
          <h3>Select Franchise</h3>
          <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">Claim a team to start bidding:</p>
          <div class="teams-grid" id="teams-selector"></div>
        </div>

        <div class="card">
          <h3>Franchise Standings</h3>
          <div id="team-standings-list" style="font-size: 0.9rem; line-height: 1.6;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Update this URL to match your deployed Render URL (or keep relative if hosted on same backend)
    const socket = io();

    let myRoomCode = "";
    let myAssignedTeam = null;

    // Lobby Handlers
    function createRoom() {
      const username = document.getElementById('username-input').value.trim() || 'Host';
      socket.emit('createRoom', { username });
    }

    function joinRoom() {
      const username = document.getElementById('username-input').value.trim() || 'Manager';
      const roomCode = document.getElementById('room-code-input').value.trim();
      if (!roomCode) return alert("Please enter a room code!");
      socket.emit('joinRoom', { roomCode, username });
    }

    function claimTeam(teamCode) {
      socket.emit('claimTeam', { teamCode });
    }

    function placeBid() {
      socket.emit('placeBid');
    }

    function triggerAutoBid() {
      socket.emit('adminAutoBid');
    }

    // Socket Event Listeners
    socket.on('roomJoined', (data) => {
      myRoomCode = data.roomCode;
      document.getElementById('room-display').innerText = `Room Code: ${data.roomCode}`;
      document.getElementById('lobby-section').classList.add('hidden');
      document.getElementById('auction-section').classList.remove('hidden');
      
      updateAuctionCard(data.auction);
      renderTeams(data.teams);
    });

    socket.on('timerUpdate', (time) => {
      document.getElementById('timer-val').innerText = time;
    });

    socket.on('bidUpdated', (auction) => {
      updateAuctionCard(auction);
    });

    socket.on('nextPlayer', (data) => {
      updateAuctionCard(data.auction);
      renderTeams(data.teams);
    });

    socket.on('updateTeams', (teams) => {
      renderTeams(teams);
    });

    socket.on('teamAssigned', (teamCode) => {
      myAssignedTeam = teamCode;
    });

    socket.on('logEvent', (data) => {
      const feedBox = document.getElementById('activity-log');
      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerText = data.text;
      feedBox.prepend(item);
    });

    socket.on('errorMsg', (msg) => {
      alert(msg);
    });

    // Helper Rendering Functions
    function updateAuctionCard(auction) {
      if (!auction || !auction.player) return;
      document.getElementById('player-name').innerText = auction.player.name;
      document.getElementById('player-role').innerText = `Role: ${auction.player.role}`;
      document.getElementById('player-base').innerText = `₹${auction.player.basePrice}L`;
      document.getElementById('player-rating').innerText = auction.player.rating;
      document.getElementById('current-bid').innerText = `₹${auction.highestBid}L`;
      document.getElementById('highest-bidder').innerText = `Highest Bidder: ${auction.highestBidder}`;
      document.getElementById('timer-val').innerText = auction.timer;
    }

    function renderTeams(teams) {
      const grid = document.getElementById('teams-selector');
      const standings = document.getElementById('team-standings-list');
      grid.innerHTML = '';
      standings.innerHTML = '';

      for (let code in teams) {
        const team = teams[code];
        
        // Render Selector Buttons
        const btn = document.createElement('div');
        btn.className = 'team-btn';
        if (team.claimedBy) {
          btn.classList.add(team.claimedBy === socket.id ? 'my-team' : 'claimed');
        }
        btn.innerHTML = `<strong>${code}</strong><br><small>${team.claimedByName || 'Open'}</small>`;
        if (!team.claimedBy || team.claimedBy === socket.id) {
          btn.onclick = () => claimTeam(code);
        }
        grid.appendChild(btn);

        // Render Purse & Squad Summary
        const info = document.createElement('div');
        info.innerHTML = `<strong>${code}</strong>: Purse ₹${team.purse}L | Squad: ${team.squad.length}/25`;
        standings.appendChild(info);
      }
    }
  </script>
</body>
</html>
