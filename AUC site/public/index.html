<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏏 Cricket Auction Simulator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 520px; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
    h2 { text-align: center; margin-top: 0; color: #1a1a1a; }
    .status { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; font-weight: 600; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .status.connected { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }
    .auction-board { background: #eef2f7; text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dbe2ec; }
    .auction-board small { color: #666; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .auction-board h1 { margin: 8px 0; font-size: 36px; color: #0f172a; }
    .auction-board .holder { font-size: 15px; color: #334155; }
    .bid-action { display: flex; gap: 10px; margin-bottom: 20px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .log-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
    #logs { height: 140px; overflow-y: auto; background: #0f172a; color: #38bdf8; padding: 12px; font-family: monospace; font-size: 12px; border-radius: 6px; line-height: 1.5; }
  </style>
  <!-- Socket.io client from official CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>🏏 Auction Simulator</h2>
    <div id="statusBox" class="status">Connecting to backend...</div>

    <div class="inputs-grid">
      <div>
        <label>Your Name / Team</label>
        <input type="text" id="bidderName" value="MI Franchise">
      </div>
      <div>
        <label>Auction Room</label>
        <input type="text" id="roomId" value="ipl-mega-auction">
      </div>
    </div>

    <div class="auction-board">
      <small>Highest Active Bid</small>
      <h1 id="bidDisplay">₹0 Lakhs</h1>
      <div class="holder">Held by: <b id="bidderDisplay">No bids yet</b></div>
    </div>

    <form id="bidForm" class="bid-action">
      <input type="number" id="bidAmount" placeholder="Bid Amount" value="20" style="flex: 2;" required>
      <button type="submit" id="bidBtn" style="flex: 1;" disabled>Place Bid</button>
    </form>

    <div class="log-label">Live Activity Feed:</div>
    <div id="logs"></div>
  </div>

  <script>
    // ==========================================
    // REPLACE THIS WITH YOUR LIVE RENDER URL
    // ==========================================
    const BACKEND_URL = "https://your-service.onrender.com";

    const statusBox = document.getElementById("statusBox");
    const bidDisplay = document.getElementById("bidDisplay");
    const bidderDisplay = document.getElementById("bidderDisplay");
    const bidAmountInput = document.getElementById("bidAmount");
    const bidBtn = document.getElementById("bidBtn");
    const logs = document.getElementById("logs");
    const roomIdInput = document.getElementById("roomId");
    const bidderNameInput = document.getElementById("bidderName");

    function addLog(msg) {
      const line = document.createElement("div");
      line.innerText = msg;
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
    }

    // Connect with polling fallback enabled
    const socket = io(BACKEND_URL, {
      transports: ["polling", "websocket"],
      reconnectionAttempts: 10,
      timeout: 30000,
    });

    socket.on("connect", () => {
      statusBox.className = "status connected";
      statusBox.innerText = `Connected! (ID: ${socket.id})`;
      bidBtn.disabled = false;
      addLog(`[System] Connected via ${socket.io.engine.transport.name}`);
      
      // Auto-join configured room
      socket.emit("join_room", roomIdInput.value);
    });

    socket.on("room_state", (state) => {
      bidDisplay.innerText = `₹${state.currentBid} Lakhs`;
      bidderDisplay.innerText = state.highestBidder;
      bidAmountInput.value = state.currentBid + 10;
      addLog(`[Room] Initialized. Current bid: ₹${state.currentBid}L by ${state.highestBidder}`);
    });

    socket.on("bid_updated", (data) => {
      bidDisplay.innerText = `₹${data.currentBid} Lakhs`;
      bidderDisplay.innerText = data.highestBidder;
      bidAmountInput.value = data.currentBid + 10;
      addLog(`[Bid] ${data.highestBidder} placed ₹${data.currentBid} Lakhs`);
    });

    socket.on("bid_error", (errMsg) => {
      alert(errMsg);
    });

    socket.on("connect_error", (err) => {
      statusBox.className = "status";
      statusBox.innerText = `Connection Failed: ${err.message} (Server might be spinning up)`;
      bidBtn.disabled = true;
      addLog(`[Error] ${err.message}`);
    });

    socket.on("disconnect", (reason) => {
      statusBox.className = "status";
      statusBox.innerText = `Disconnected: ${reason}`;
      bidBtn.disabled = true;
      addLog(`[System] Disconnected: ${reason}`);
    });

    // Form submit
    document.getElementById("bidForm").addEventListener("submit", (e) => {
      e.preventDefault();
      socket.emit("place_bid", {
        roomId: roomIdInput.value,
        amount: Number(bidAmountInput.value),
        bidderName: bidderNameInput.value
      });
    });
  </script>
</body>
</html>
